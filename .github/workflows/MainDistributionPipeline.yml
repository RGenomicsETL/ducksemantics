name: Extension Distribution

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: extension-distribution-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-extension:
    name: Linux stable-C-ABI artifacts and native contracts
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@72e76e99cd7fee45a99739cd118ec2db64e034ec
    with:
      extension_name: ducksemantics
      duckdb_version: v1.5.5
      ci_tools_version: 72e76e99cd7fee45a99739cd118ec2db64e034ec
      # Cache timestamp accessors and mapped-file readers require separate
      # portability verification before these platforms enter distribution.
      exclude_archs: 'linux_amd64_musl;linux_arm64_musl;osx_amd64;osx_arm64;windows_amd64;windows_arm64;windows_amd64_mingw;windows_amd64_rtools;wasm_mvp;wasm_eh;wasm_threads'
      # The project runs its C oracles and CLI SQL suite against the built
      # release artifact, with upstream wheel-based skips explicitly disabled.
      skip_tests: false
