name: R package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r/ducksemantics
          extra-packages: |
            any::duckdb
            any::tinytest
            any::rmarkdown
            any::knitr
      - name: Build and test the self-contained source package
        run: make r-test r-sync-check
      - name: Check the source tarball
        run: |
          cd build/r
          R CMD check --no-manual --no-build-vignettes ducksemantics_*.tar.gz
          grep -q '^Status: OK' ducksemantics.Rcheck/00check.log
      - name: Execute the README
        run: R_LIBS=build/r/library Rscript scripts/render-readme.R
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r-package-check
          path: |
            build/r/ducksemantics.Rcheck
            README.md
